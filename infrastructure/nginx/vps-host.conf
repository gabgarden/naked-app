# Configuração do Nginx no HOST da VPS (Hostinger)
# Arquivo no host: /etc/nginx/sites-available/naked.conf
# Ativar com: sudo ln -s /etc/nginx/sites-available/naked.conf /etc/nginx/sites-enabled/
# SSL com: sudo certbot --nginx -d naked.seudominio.com.br

server {
    listen 80;
    server_name naked.seudominio.com.br; # Substitua pelo seu domínio/subdomínio ou IP

    client_max_body_size 20m;

    location / {
        # Encaminha para o container Nginx do Naked App que expõe na porta 8084
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# Production overrides for Hostinger / VPS
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# TLS/SSL is terminated by the host Nginx (/etc/nginx/sites-available/pelada.conf),
# which proxies to the container Nginx on port :8084.
# Certificates are issued and renewed by the host Certbot (certbot --nginx).

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pelada_app}

  api:
    ports: !reset []
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-pelada_app}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pelada_app}
      CORS_ORIGIN: "*"

  web:
    ports: !reset []
    environment:
      PORT: 3000
      INTERNAL_API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ""

  adminer:
    profiles: ["debug"]
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    container_name: pelada-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-8084}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
